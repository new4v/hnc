# ── Prefix ───────────────────────────────────────────────────────────────────
# Change prefix from C-b to C-a (screen-style, easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true-colour passthrough
set -g history-limit 10000
set -g escape-time 10                       # faster escape in Neovim/Vim
set -g focus-events on

# ── Mouse ─────────────────────────────────────────────────────────────────────
set -g mouse on

# ── Windows and panes start at 1 ─────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Splits ────────────────────────────────────────────────────────────────────
# | for vertical split, - for horizontal split, both in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window opens in current path
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation (Vim-style) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing ─────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi bindings) ───────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 30
set -g status-right-length 60

set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[fg=colour2,bold] #S #[default]"
set -g status-right "#[fg=colour248] %Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour15,bg=colour238,bold] #I:#W "
